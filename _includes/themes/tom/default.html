<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="en" lang="en-us">
<head>
   <meta http-equiv="content-type" content="text/html; charset=utf-8" />
   <title>{{ page.title }}</title>
   <meta name="author" content="{{ site.author.name }}" />
   <meta name="google-site-verification" content="wfcNiix3s52fkJ6QTVFZo-Tb6Zkj4p_w26x-zr7ICp4" />
   <!-- syntax highlighting CSS -->
   <link rel="stylesheet" href="{{ ASSET_PATH }}/css/syntax.css" type="text/css" />

   <!-- google fonts -->
   <link rel="preconnect" href="https://fonts.googleapis.com">
   <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
   <link href="https://fonts.googleapis.com/css2?family=Crimson+Text:ital,wght@0,400;0,600;0,700;1,400;1,600;1,700&family=IBM+Plex+Serif:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;1,100;1,200;1,300;1,400;1,500;1,600;1,700&display=swap" rel="stylesheet">

   <!-- Homepage CSS -->
   <link rel="stylesheet" href="{{ ASSET_PATH }}/css/screen.css" type="text/css" media="screen, projection" />

   <!-- <\!-- Typekit -\-> -->
   <!-- <script type="text/javascript" src="http://use.typekit.com/jpd0pfm.js"></script> -->
   <!-- <script type="text/javascript">try{Typekit.load();}catch(e){}</script> -->
</head>
<body>

  <div class="site">
    <p class="title">
        <a href="{{ HOME_PATH }}">{{ site.title }}</a>
    </p>
    <div class="nav">
      <a class="nav-items" href="{{ BASE_PATH }}{{ site.JB.archive_path }}">Archive</a>
      <!-- <a class="extra" href="{{ BASE_PATH }}{{ site.JB.pages_path }}">Pages</a> -->
      <a class="nav-items" href="{{ BASE_PATH }}{{ site.JB.categories_path }}">Categories</a>
      <a class="nav-items" href="{{ BASE_PATH }}{{ site.JB.tags_path }}">Tags</a>
    </div>

    {{ content }}

    <div class="footer">
        <ul class="footer-links">
            <li>
                <a class="footer-icon" href="http://github.com/{{ site.author.github }}/" rel="me" aria-label="GitHub">
                    <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82A7.65 7.65 0 0 1 8 3.86c.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z"/></svg>
                    <span class="visually-hidden">github.com/{{ site.author.github }}</span>
                </a>
            </li>
            <li>
                <a class="footer-icon" href="http://twitter.com/{{ site.author.twitter }}/" rel="me" aria-label="Twitter">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18.24 2.25h3.31l-7.23 8.26 8.5 11.24h-6.66l-5.22-6.82-5.97 6.82H1.66l7.73-8.84L1.23 2.25h6.83l4.71 6.23 5.47-6.23Zm-1.16 17.52h1.83L7.07 4.13H5.1l11.98 15.64Z"/></svg>
                    <span class="visually-hidden">twitter.com/{{ site.author.twitter }}</span>
                </a>
            </li>
            <li>
                <span class="footer-email">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 5h18a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1Zm9 8.15L5.76 7H4.41L12 14.48 19.59 7h-1.35L12 13.15Z"/></svg>
                    <span>{{ site.author.email }}</span>
                </span>
            </li>
            <li>
                <a class="footer-icon" href="/atom.xml" aria-label="RSS feed">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 19a2 2 0 1 1 0-4 2 2 0 0 1 0 4ZM3 4.5V8a13 13 0 0 1 13 13h3.5C19.5 11.89 12.11 4.5 3 4.5Zm0 6V14a7 7 0 0 1 7 7h3.5A10.5 10.5 0 0 0 3 10.5Z"/></svg>
                    <span class="visually-hidden">RSS feed</span>
                </a>
            </li>
        </ul>
    </div>
  </div>
  {% include JB/analytics %}
</body>
</html>
